<style>
html,body{margin:0;height:100%}
body{background:#2A1A0E;color:#2A1A0E;font-family:Fraunces,Georgia,serif;-webkit-font-smoothing:antialiased}
@keyframes room{0%,60%{background-color:#2A1A0E}100%{background-color:#F6B27A}}
@keyframes eyecolor{0%,60%{background-color:#F6B27A}100%{background-color:#2A1A0E}}
@keyframes firstblink{0%,38%{transform:scaleY(1)}42%{transform:scaleY(0.06)}46%{transform:scaleY(1)}100%{transform:scaleY(1)}}
@keyframes blink{0%,100%{transform:scaleY(1)}3%{transform:scaleY(0.06)}6%{transform:scaleY(1)}48%{transform:scaleY(1)}51%{transform:scaleY(0.06)}54%{transform:scaleY(1)}}
@keyframes words{0%,80%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
@keyframes duck{0%{transform:translateY(0)}100%{transform:translateY(0.95em)}}
@keyframes seek{
  0%{transform:translate(calc(-1 * var(--reach)),0)}
  5%{transform:translate(calc(-1 * var(--reach)),-0.95em)}
  22%{transform:translate(calc(-1 * var(--reach)),-0.95em)}
  26%{transform:translate(calc(-1 * var(--reach)),0)}
  34%{transform:translate(var(--reach),0)}
  38%{transform:translate(var(--reach),-0.95em)}
  56%{transform:translate(var(--reach),-0.95em)}
  60%{transform:translate(var(--reach),0)}
  66%{transform:translate(0,0)}
  70%{transform:translate(0,-0.95em)}
  94%{transform:translate(0,-0.95em)}
  98%{transform:translate(0,0)}
  100%{transform:translate(calc(-1 * var(--reach)),0)}
}
.room{min-height:100vh;min-height:100svh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;background:#F6B27A;animation:room 2.2s ease-in-out both}
.block{display:flex;flex-direction:column;align-items:center;font-size:clamp(48px,9vw,140px);max-width:100%;width:100%}
.slot{position:relative;height:0.62em;width:100%;z-index:1}
.stage{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;animation:duck .55s cubic-bezier(.4,0,.6,1) 3.4s both}
.seek{display:flex;gap:0.34em;--reach:max(0.9em,26vw);animation:seek 16s cubic-bezier(.3,.9,.3,1) 4.3s infinite}
.eye{display:block;width:0.17em;height:0.52em;border-radius:999px;background:#2A1A0E;transform-origin:50% 50%;animation:eyecolor 2.2s ease-in-out both,firstblink 2.2s ease-in-out both,blink 4.6s ease-in-out 2.2s infinite}
.eye.b{animation-delay:0s,0s,2.28s}
.wall{position:relative;z-index:2;padding-top:0.28em;background:#F6B27A;width:100%;display:flex;justify-content:center;animation:room 2.2s ease-in-out both}
h1{margin:0;font-family:Fraunces,Georgia,serif;font-weight:400;font-size:1em;line-height:0.98;letter-spacing:-0.03em;text-align:center;text-wrap:balance;max-width:100%;animation:words 2.8s ease-out both}
@media (prefers-reduced-motion: reduce){
  .room,.wall,.stage,.seek,.eye,h1{animation:none}
  .room,.wall{background:#F6B27A}
  .stage{transform:none}
}
</style>
</head>
<body>
<main class="room">
  <div class="block">
    <div class="slot" aria-hidden="true">
      <div class="stage">
        <div class="seek">
          <span class="eye a"></span>
          <span class="eye b"></span>
        </div>
      </div>
    </div>
    <div class="wall">
      <h1>Honey, someone's home.</h1>
    </div>
  </div>
</main>
</body>
</html>
